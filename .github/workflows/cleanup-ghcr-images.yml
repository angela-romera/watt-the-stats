name: Cleanup GHCR Images

on:
  schedule:
    - cron: "17 1 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview deletions without removing image versions
        type: boolean
        default: true

permissions: {}

concurrency:
  group: cleanup-ghcr-images
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'angela-romera/watt-the-stats' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove old image versions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            const cleanup = require('./.github/scripts/cleanup-ghcr-images.cjs');
            await cleanup({ github, context, core });
